<!DOCTYPE html>
<html>
<head>
    <title>Network Configuration</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="referrer no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style type="text/css">
        /* ========== Base Styles ========== */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        /* ========== Form Elements ========== */
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 10px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        input[type="submit"]:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #remember_bssid, #sleep_mode {
            width: auto;
        }

        /* ========== AP List Styles ========== */
        #ap_list {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
        #ap_list .scanning {
            font-style: italic;
            color: #666;
        }
        #ap_list a {
            display: block;
            margin-top: 5px;
            color: #007bff;
            text-decoration: none;
        }
        #ap_list a:hover {
            text-decoration: underline;
        }

        /* ========== Language Switcher ========== */
        .language-switch {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .language-switch select {
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        /* ========== Tab Styles ========== */
        .tabs {
            display: flex;
            flex-wrap: wrap;         /* extra tabs wrap instead of overflowing */
            margin-top: 20px;
            margin-bottom: 0;
            padding-left: 20px;
            /* Reserve room for the absolutely-positioned language switcher
               (top:20px; right:20px) so the last tab never overlaps it. */
            padding-right: 200px;
            border-bottom: 1px solid #ccc;
        }
        @media (max-width: 600px) {
            .tabs {
                /* Narrow screens: the language select is compact, so a
                   smaller reservation still avoids overlap at 375px. */
                padding-left: 8px;
                padding-right: 110px;
            }
            .tab {
                padding: 10px 12px;
            }
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            margin-right: 5px;
            background-color: #f0f0f0;
            position: relative;
            top: 1px;
        }
        .tab.active {
            background-color: #fff;
        }
        .tab-content {
            display: none;
            border-top: none;
            padding: 20px;
            background-color: #fff;
        }
        .tab-content.active {
            display: block;
        }

        /* ========== Toast Message Styles ========== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            min-width: 200px;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }

        /* ========== Loading Spinner Styles ========== */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .loading-overlay.show {
            display: flex;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .loading-text {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

            <option value="nb-NO">Norsk</option>

            <option value="pl-PL">Polski</option>
            <option value="pt-PT">Português</option>
            <option value="ro-RO">Română</option>

            <option value="zh-TW">繁體中文</option>

    <!-- Tabs -->

        <div class="tab active" onclick="switchTab('wifi')" data-lang="wifi_tab">Wi-Fi Config</div>
        <div class="tab" onclick="switchTab('advanced')" data-lang="advanced_tab">Advanced</div>
        <div class="tab" onclick="switchTab('other')" data-lang="other_tab">Other</div>
    </div>

    <!-- Wi-Fi Configuration Tab -->
    <div id="wifi-tab" class="tab-content active">
        <!-- Saved Wi-Fi List -->
        <div id="saved_list_container" style="display: none;">
            <h3 data-lang="saved_wifi">Saved Wi-Fi</h3>
            <ul id="saved_list">
                <li><span>SSID</span></li>
            </ul>
        </div>
        
        <!-- New Wi-Fi Connection -->
        <div>
            <h3 data-lang="new_wifi">New Wi-Fi</h3>
            <p class="error" style="color: red; text-align: center;" id="error"></p>
            <form action="/submit" method="post" onsubmit="submitForm(event)">
                <p>
                    <label for="ssid">SSID:</label>
                    <input type="text" id="ssid" name="ssid" required readonly>
                </p>
                <p>
                    <label for="password" data-lang="password">Password:</label>
                    <input type="password" id="password" name="password">
                </p>
                <p style="text-align: center;">
                    <input type="submit" value="Connect" id="button" data-lang-value="connect">
                </p>
            </form>
            <p id="ap_list"></p>
        </div>
    </div>

    <!-- Advanced Configuration Tab -->
    <div id="advanced-tab" class="tab-content">
        <form action="/advanced/submit" method="post" onsubmit="submitAdvancedForm(event)">
            <div>
                <h3 data-lang="advanced_tab">Advanced</h3>
                <p class="error" style="color: red; text-align: center;" id="advanced_error"></p>
                
                <!-- OTA URL -->
                <p>
                    <label for="ota_url" data-lang="ota_url">Custom OTA URL:</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="text" id="ota_url" name="ota_url" style="flex: 1;">
                        <button type="button" onclick="clearOtaUrl()" style="padding: 5px 10px; border: 1px solid #ccc; border-radius: 3px; background-color: #f0f0f0; cursor: pointer;">❌</button>
                    </div>
                </p>

                <!-- Max TX Power -->
                <p style="display: flex; align-items: center; gap: 10px;">
                    <label for="max_tx_power" data-lang="max_tx_power" style="white-space: nowrap;">Wi-Fi Max TX Power:</label>
                    <select id="max_tx_power" name="max_tx_power">
                        <option value="8">2 dBm</option>
                        <option value="20">5 dBm</option>
                        <option value="28">7 dBm</option>
                        <option value="34">8 dBm</option>
                        <option value="44">11 dBm</option>
                        <option value="52">13 dBm</option>
                        <option value="56">14 dBm</option>
                        <option value="60">15 dBm</option>
                        <option value="66">16 dBm</option>
                        <option value="72">18 dBm</option>
                        <option value="80">20 dBm</option>
                    </select>
                </p>

                <!-- Remember BSSID -->
                <p style="display: flex; align-items: center; gap: 10px;">
                    <label for="remember_bssid" style="margin: 0;">
                        <span data-lang="remember_bssid">Remember BSSID when connecting to Wi-Fi</span>
                    </label>
                    <input type="checkbox" id="remember_bssid" name="remember_bssid">
                </p>

                <!-- Sleep Mode -->
                <p style="display: flex; align-items: center; gap: 10px;">
                    <label for="sleep_mode" style="margin: 0;">
                        <span data-lang="sleep_mode">Enable Sleep Mode</span>
                    </label>
                    <input type="checkbox" id="sleep_mode" name="sleep_mode">
                </p>

                <p style="text-align: center;">
                    <input type="submit" value="Save" id="advanced_button" data-lang-value="save">
                </p>
            </div>
        </form>
    </div>

    <!-- Other Tab: frame settings (web) + device-side settings shortcut -->
    <div id="other-tab" class="tab-content">
        <div>
            <h3 data-lang="frame_section_title">Frame Settings</h3>
            <p class="error" style="color: red; text-align: center;" id="frame_settings_error"></p>

            <!-- Timezone: keep this list in sync with
                 main/common/frame_settings.cc kTimeZoneList -->
            <p>
                <label for="frame_tz" data-lang="tz_label">Timezone:</label>
                <select id="frame_tz">
                    <option value="CST-8">UTC+8 中国</option>

                    <option value="JST-9">UTC+9 日本</option>
                    <option value="KST-9">UTC+9 韩国</option>
                    <option value="ICT-7">UTC+7 泰国越南</option>
                    <option value="IST-5:30">UTC+5.5 印度</option>
                    <option value="GST-4">UTC+4 迪拜</option>
                    <option value="MSK-3">UTC+3 莫斯科</option>
                    <option value="EET-2">UTC+2 开罗雅典</option>
                    <option value="CET-1">UTC+1 中欧</option>
                    <option value="GMT0">UTC+0 伦敦</option>
                    <option value="UTC0">UTC0 协调世界时</option>
                    <option value="EST5">UTC-5 美东</option>
                    <option value="CST6">UTC-6 美中</option>
                    <option value="MST7">UTC-7 美西山地</option>
                    <option value="PST8">UTC-8 美西</option>
                </select>
            </p>

            <!-- Auto refresh mode -->
            <p>
                <label for="frame_refresh_mode" data-lang="refresh_label">Auto Refresh:</label>
                <select id="frame_refresh_mode" onchange="onFrameRefreshModeChange()">
                    <option value="0" data-lang="refresh_mode_off">Off</option>
                    <option value="1" data-lang="refresh_mode_interval">Interval</option>
                    <option value="2" data-lang="refresh_mode_fixed">Fixed Time</option>
                </select>
            </p>

            <!-- Interval mode: minutes (5..10080) -->
            <p id="frame_refresh_interval_row" style="display: none;">
                <label for="frame_refresh_interval" data-lang="interval_minutes_label">Interval (minutes):</label>
                <input type="number" id="frame_refresh_interval" min="5" max="10080" value="1440">
            </p>

            <!-- Fixed time mode: minutes-of-day as HH:MM -->
            <p id="frame_refresh_time_row" style="display: none;">
                <label for="frame_refresh_time" data-lang="fixed_time_label">Fixed Time:</label>
                <input type="time" id="frame_refresh_time" value="00:00">
            </p>

            <!-- Image source: presets mirror the on-device cycle
                 (application.cc kSources); "" = built-in default (loremflickr) -->
            <p>
                <label for="frame_image_source" data-lang="image_source_label">Image Source:</label>
                <select id="frame_image_source" onchange="onFrameImageSourceChange()">
                    <option value="" data-lang="image_source_default">Default (random photo)</option>
                    <option value="http://192.168.1.10:8787/random.jpg" data-lang="image_source_src1">Source 1</option>
                    <option value="https://picsum.photos/{W}/{H}" data-lang="image_source_src2">Source 2</option>
                    <option value="__custom__" data-lang="image_source_custom">Custom URL</option>
                </select>
            </p>
            <p id="frame_image_source_custom_row" style="display: none;">
                <label for="frame_image_source_custom" data-lang="image_source_custom_label">Custom URL ({W}/{H} supported):</label>
                <input type="text" id="frame_image_source_custom" maxlength="127"
                       placeholder="https://example.com/photo/{W}/{H}">
            </p>

            <p style="text-align: center;">
                <input type="button" value="Save Frame Settings" id="frame_settings_button"
                       data-lang-value="save_frame_settings" onclick="saveFrameSettings()">
            </p>

            <hr>

            <!-- Secondary entry: open the on-device settings page -->
            <h3 data-lang="other_tab">Other</h3>
            <p style="text-align: center; color: #666;">
                <span data-lang="device_settings_hint">The settings page will open on the device screen. Please continue on the device.</span>
            </p>
            <p style="text-align: center;">
                <input type="button" value="Open Settings on Device" id="device_settings_button"
                       data-lang-value="open_device_settings" onclick="openDeviceSettings()">
            </p>
        </div>

        // ========== Helper Functions ==========
        
        /**
         * Get supported language code from browser language
         */
        function getSupportedLanguage(lang) {
            // First try exact match
            if (languageMap[lang]) {
                return languageMap[lang];
            }
            // Then try to match only the main language code
            const mainLang = lang.split('-')[0];
            if (languageMap[mainLang]) {
                return languageMap[mainLang];
            }
            // If no match, return English
            return 'en-US';
        }

        /**
         * Change the page language
         */
        function changeLanguage() {
            const lang = document.getElementById('language').value;
            
            // Check if language is valid
            if (!translations[lang]) {
                console.warn(`Unsupported language: ${lang}, defaulting to English`);
                document.getElementById('language').value = 'en-US';
                return changeLanguage();
            }
            
            // Set page title
            document.title = translations[lang].title;
            
            // Update text content
            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                element.textContent = translations[lang][key];
            });
            
            // Update input values
            document.querySelectorAll('[data-lang-value]').forEach(element => {
                const key = element.getAttribute('data-lang-value');
                element.value = translations[lang][key];
            });
            
            // Update AP list text based on 5G support
            const apList = document.getElementById('ap_list');
            if (apList.firstChild) {
                const selectText = support5G ? translations[lang].select_wifi_5g : translations[lang].select_wifi;
                apList.firstChild.textContent = selectText;
            }
            
            // Save language preference
            localStorage.setItem('preferred_language', lang);
        }

        // ========== Wi-Fi List Management ==========
        
        /**
         * Render saved Wi-Fi list
         */
        function renderSavedList(data) {
            const savedListContainer = document.getElementById('saved_list_container');
            const savedList = document.getElementById('saved_list');
            savedList.innerHTML = '';
            
            data.forEach((ssid, index) => {
                const li = document.createElement('li');
                let html = `<span>${ssid}</span>`;
                
                // Only add priority and delete buttons after the first item
                if (index > 0) {
                    html += ` <span>
                        <button type="button" onclick="setDefaultItem(this, ${index})">⬆️</button>
                        <button type="button" onclick="deleteItem(this, ${index})">❌</button>
                    </span>`;
                } else {
                    html += ` <span><button type="button" onclick="deleteItem(this, ${index})">❌</button></span>`;
                }
                
                li.innerHTML = html;
                savedList.appendChild(li);
            });
            
            // Show/hide container based on whether there are saved networks
            savedListContainer.style.display = data.length > 0 ? 'block' : 'none';
        }

        /**
         * Delete saved Wi-Fi network
         */
        function deleteItem(item, index) {
            item.disabled = true;
            fetch('/saved/delete?index=' + index)
                .then(response => response.json())
                .then(data => {
                    loadSavedList();
                });
        }

        /**
         * Set default Wi-Fi network (move to top)
         */
        function setDefaultItem(item, index) {
            item.disabled = true;
            fetch('/saved/set_default?index=' + index)
                .then(response => response.json())
                .then(data => {
                    loadSavedList();
                });
        }

        /**
         * Load saved Wi-Fi list from server
         */
        function loadSavedList() {
            fetch('/saved/list')
                .then(response => response.json())
                .then(data => {
                    renderSavedList(data);
                });
        }

        /**
         * Load available Wi-Fi networks
         */
        function loadAPList() {
            if (button.disabled) {
                return;
            }

            const lang = document.getElementById('language').value;
            const apList = document.getElementById('ap_list');

            // Check if AP list already has content
            const hasExistingAPs = apList.querySelector('a') !== null;

            // Only show scanning text if there's no existing AP list
            if (!hasExistingAPs) {
                apList.innerHTML = '<p class="scanning">' + translations[lang].scanning + '</p>';
            }

            fetch('/scan')
                .then(response => response.json())
                .then(data => {
                    // Update global 5G support status
                    support5G = data.support_5g;
                    
                    // Use select_wifi_5g if 5G is supported, otherwise use select_wifi
                    const selectText = support5G ? translations[lang].select_wifi_5g : translations[lang].select_wifi;
                    apList.innerHTML = '<p>' + selectText + '</p>';
                    
                    // Iterate through available APs
                    data.aps.forEach(ap => {
                        const link = document.createElement('a');
                        link.href = '#';
                        link.textContent = ap.ssid + ' (' + ap.rssi + ' dBm)';
                        
                        // Add lock icon for secured networks
                        if (ap.authmode === 0) {
                            link.textContent += ' 🌐';
                        } else {
                            link.textContent += ' 🔒';
                        }
                        
                        link.addEventListener('click', () => {
                            ssid.value = ap.ssid;
                        });
                        
                        apList.appendChild(link);
                    });
                    
                    // Refresh AP list every 5 seconds
                    setTimeout(loadAPList, 5000);
                })
                .catch(error => {
                    console.error('Error:', error);
                    // On error, try again after 5 seconds
                    setTimeout(loadAPList, 5000);
                });
        }

        // ========== Form Submission ==========
        
        /**
         * Submit Wi-Fi connection form
         */
        async function submitForm(event) {
            event.preventDefault();
            button.disabled = true;
            error.textContent = '';

            // Show loading animation
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('show');

            const payload = {
                ssid: ssid.value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Connection failed');
                }

                // Connection successful, redirect to done page
                button.disabled = false;
                window.location.href = '/done.html';
            } catch (err) {
                // Hide loading animation on error
                loadingOverlay.classList.remove('show');
                error.textContent = err.message;
                button.disabled = false;
            }
        }

        /**
         * Submit advanced configuration form
         */
        async function submitAdvancedForm(event) {
            event.preventDefault();
            const advancedButton = document.getElementById('advanced_button');
            const advancedError = document.getElementById('advanced_error');
            advancedButton.disabled = true;
            advancedError.textContent = '';

            const config = {
                ota_url: document.getElementById('ota_url').value,
                max_tx_power: parseInt(document.getElementById('max_tx_power').value),
                remember_bssid: document.getElementById('remember_bssid').checked,
                sleep_mode: document.getElementById('sleep_mode').checked
            };

            try {
                const response = await fetch('/advanced/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Save failed');
                }

                advancedButton.disabled = false;
                showToast('Configuration saved');
            } catch (err) {
                advancedError.textContent = err.message;
                advancedButton.disabled = false;
            }
        }

        /**
         * Ask the device to open its settings page on the e-paper screen
         */
        async function openDeviceSettings() {
            const btn = document.getElementById('device_settings_button');
            btn.disabled = true;
            try {
                const response = await fetch('/device-settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: '{}'
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const lang = document.getElementById('language').value;
                showToast(translations[lang].device_settings_hint);
            } catch (err) {
                showToast('Error: ' + err.message);
            } finally {
                setTimeout(() => { btn.disabled = false; }, 2000);
            }
        }

        // ========== UI Functions ==========
        
        /**
         * Switch between tabs
         */
        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab content
            document.getElementById(tabName + '-tab').classList.add('active');

            // Activate selected tab
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');

            // Refresh frame settings from the device when entering Other tab
            if (tabName === 'other') {
                loadFrameSettings();
            }
        }

        /**
         * Show/hide the interval / fixed-time input rows based on the
         * selected auto refresh mode.
         */
        function onFrameRefreshModeChange() {
            const mode = parseInt(document.getElementById('frame_refresh_mode').value, 10);
            document.getElementById('frame_refresh_interval_row').style.display =
                mode === 1 ? 'block' : 'none';
            document.getElementById('frame_refresh_time_row').style.display =
                mode === 2 ? 'block' : 'none';
        }

        /**
         * Show the custom-URL input only when "Custom URL" is selected
         */
        function onFrameImageSourceChange() {
            const sel = document.getElementById('frame_image_source');
            document.getElementById('frame_image_source_custom_row').style.display =
                sel.value === '__custom__' ? 'block' : 'none';
        }

        /**
         * Load current frame settings from the device and fill the form
         */
        async function loadFrameSettings() {
            try {
                const response = await fetch('/frame-settings');
                const data = await response.json();
                if (data.success === false) {
                    // Backend not ready yet (callbacks not registered).
                    console.warn('Frame settings not ready:', data.error);
                    return;
                }
                if (data.tz) {
                    document.getElementById('frame_tz').value = data.tz;
                }
                if (data.refresh_mode !== undefined) {
                    document.getElementById('frame_refresh_mode').value =
                        String(data.refresh_mode);
                }
                if (data.refresh_interval_minutes !== undefined) {
                    document.getElementById('frame_refresh_interval').value =
                        data.refresh_interval_minutes;
                }
                if (data.refresh_time !== undefined) {
                    // minutes-of-day -> "HH:MM"
                    const hh = String(Math.floor(data.refresh_time / 60)).padStart(2, '0');
                    const mm = String(data.refresh_time % 60).padStart(2, '0');
                    document.getElementById('frame_refresh_time').value = hh + ':' + mm;
                }
                // Image source: match a preset option, map the effective
                // default URL back to the "" (Default) option, anything else
                // lands in the custom input.
                if (data.image_source !== undefined) {
                    const sel = document.getElementById('frame_image_source');
                    const src = data.image_source || '';
                    let matched = false;
                    for (const opt of sel.options) {
                        if (opt.value !== '__custom__' && opt.value === src) {
                            sel.value = src;
                            matched = true;
                            break;
                        }
                    }
                    if (!matched && (src === '' || src.indexOf('loremflickr') !== -1)) {
                        sel.value = '';
                        matched = true;
                    }
                    if (!matched) {
                        sel.value = '__custom__';
                        document.getElementById('frame_image_source_custom').value = src;
                    }
                    onFrameImageSourceChange();
                }
                onFrameRefreshModeChange();
            } catch (err) {
                console.error('Error loading frame settings:', err);
            }
        }

        /**
         * Save frame settings to the device (POST /frame-settings).
         * The button is debounced for 2s to avoid double submits.
         */
        async function saveFrameSettings() {
            const btn = document.getElementById('frame_settings_button');
            const errEl = document.getElementById('frame_settings_error');
            if (btn.disabled) {
                return; // 2s anti-double-click guard
            }
            btn.disabled = true;
            errEl.textContent = '';

            const mode = parseInt(document.getElementById('frame_refresh_mode').value, 10);
            let interval = parseInt(document.getElementById('frame_refresh_interval').value, 10);
            if (isNaN(interval)) {
                interval = 1440;
            }
            const timeVal = document.getElementById('frame_refresh_time').value; // "HH:MM"
            let minutesOfDay = 0;
            if (timeVal) {
                const parts = timeVal.split(':');
                minutesOfDay = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            }

            // Image source: preset value directly; custom takes the input.
            let imageSource = document.getElementById('frame_image_source').value;
            if (imageSource === '__custom__') {
                imageSource =
                    document.getElementById('frame_image_source_custom').value.trim();
                if (imageSource && !/^https?:\/\//.test(imageSource)) {
                    errEl.textContent = 'Image source must start with http:// or https://';
                    btn.disabled = false;
                    return;
                }
            }

            const payload = {
                tz: document.getElementById('frame_tz').value,
                refresh_mode: mode,
                refresh_interval_minutes: interval,
                refresh_time: minutesOfDay,
                image_source: imageSource
            };

            try {
                const response = await fetch('/frame-settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Save failed');
                }

                const lang = document.getElementById('language').value;
                showToast(translations[lang].frame_settings_saved);
            } catch (err) {
                errEl.textContent = err.message;
            } finally {
                // Debounce: re-enable after 2 seconds.
                setTimeout(() => { btn.disabled = false; }, 2000);
            }
        }

        /**
         * Show toast notification
         */
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        /**
         * Load advanced configuration from server
         */
        async function loadAdvancedConfig() {
            try {
                const response = await fetch('/advanced/config');
                const data = await response.json();
                
                if (data.ota_url) {
                    document.getElementById('ota_url').value = data.ota_url;
                }
                if (data.max_tx_power) {
                    document.getElementById('max_tx_power').value = data.max_tx_power;
                }
                if (data.remember_bssid !== undefined) {
                    document.getElementById('remember_bssid').checked = data.remember_bssid;
                }
                if (data.sleep_mode !== undefined) {
                    document.getElementById('sleep_mode').checked = data.sleep_mode;
                }
            } catch (error) {
                console.error('Error loading advanced config:', error);
            }
        }

        /**
         * Clear OTA URL input field
         */
        function clearOtaUrl() {
            document.getElementById('ota_url').value = '';
        }

        // ========== Initialization ==========
        
        /**
         * Initialize page on DOM load
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Get language setting from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            
            // Get browser language
            const browserLang = navigator.language || navigator.userLanguage;
            
            // Priority: URL parameter > local storage > browser language setting
            const savedLang = langParam || 
                             localStorage.getItem('preferred_language') || 
                             getSupportedLanguage(browserLang);
            
            document.getElementById('language').value = savedLang;
            changeLanguage();
            loadSavedList();
            loadAPList();
            loadAdvancedConfig();
            loadFrameSettings();
        });

        /**
         * Handle browser back button
         */
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadSavedList();
            }
        });

        /**
         * Enable SSID input (fix iOS bug)
         */
        ssid.addEventListener('touchstart', () => {
            ssid.removeAttribute('readonly');
            ssid.focus();
        }, {once: true});
    </script>
</body>
</html>
